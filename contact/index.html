<script>
(function () {
  var copied = document.getElementById("copied");
  document.getElementById("copy").addEventListener("click", function () {
    var t = document.getElementById("email").textContent;
    function ok() { copied.textContent = "Copied"; setTimeout(function () { copied.textContent = ""; }, 1800); }
    function fallback() { var r = document.createRange(); r.selectNodeContents(document.getElementById("email")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); copied.textContent = "Selected. Press copy."; }
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
  });
})();
</script>
